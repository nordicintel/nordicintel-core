name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not postgres"
      - run: uv build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: nordicintel_test
          POSTGRES_DB: nordicintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nordicintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NORDICINTEL_DATABASE_URL: postgresql://postgres:nordicintel_test@localhost:5432/nordicintel
      NORDICINTEL_TEST_DATABASE_URL: postgresql://postgres:nordicintel_test@localhost:5432/nordicintel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev --locked
      - run: uv run python -m nordicintel_core.database migrate upgrade
      - run: uv run pytest -m postgres
      - run: uv run python -m nordicintel_core.database migrate downgrade
      - run: uv run python -m nordicintel_core.database migrate upgrade
